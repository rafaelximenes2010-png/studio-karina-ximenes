name: Gerar ícones Studio Karina
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Renderizar ícones PNG para iOS e PWA
        run: |
          python -m pip install --quiet cairosvg pillow
          python - <<'PY'
          import cairosvg
          from PIL import Image
          from io import BytesIO
          for size in (180,192,512):
              png=cairosvg.svg2png(url='app-icon.svg',output_width=size,output_height=size)
              im=Image.open(BytesIO(png)).convert('RGB')
              im.save(f'icon-{size}.png',optimize=True)
          PY
      - name: Salvar ícones no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-180.png icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Gerar ícones PNG para iPhone e PWA" && git push)
